
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Online Shop</title>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#shop">Shop</a>
        <a href="#cart">Cart <span id="cart-count">0</span></a>
    </nav>

    <h1>JavaScript Online Shop</h1>

    <section id="shop">
        <h2>Products</h2>
        <div id="category-filters"></div>
        <div id="product-grid"></div>
    </section>

    <p id="error-message" aria-live="polite"></p>

    <section id="cart">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <p id="cart-total">Cart Total: $0.00</p>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
